[project]
name = "demo-playwright-proxy"
version = "0.1.0"
description = "Bloqueio de assets no Playwright com proxy autenticado na frente"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["playwright>=1.62.0"]

[dependency-groups]
dev = ["ruff>=0.14.10"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP"]
