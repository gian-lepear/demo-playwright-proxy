# Proxy autenticado local no lugar de um residencial pago. O que quebra o
# `--proxy-server` do Chrome é exigir usuário e senha, não o IP ser residencial,
# e isso um Squid local reproduz de graça.

# Sem isto o Squid dimensiona estruturas internas pelo RLIMIT_NOFILE do
# container, que no Docker é enorme, e aborta com "xcalloc: Unable to allocate",
# que não menciona descritor de arquivo. É o bug LP#1978272, e a imagem oficial
# carrega esta linha num include que some quando se troca o squid.conf.
max_filedescriptors 1024

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm proxy do demo
auth_param basic children 5
# NÃO colocar `credentialsttl 0 seconds`. Parece a escolha certa pra garantir
# que o 407 aconteça sempre, e derruba o Squid com segfault no primeiro CONNECT
# autenticado. O 407 acontece na primeira requisição de qualquer jeito.

# A ordem decide, porque a primeira regra que casa vence. O `allow autenticado`
# lá embaixo abriria túnel pra qualquer porta se viesse antes destas duas.
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

acl autenticado proxy_auth REQUIRED
http_access allow autenticado
http_access deny all

http_port 3128

# Sem cache. Proxy residencial não cacheia, e cache aqui falsearia a medição: a
# segunda execução mediria zero byte.
cache deny all

# `%<st` é o que o Squid entregou ao cliente nesta transação, que é a grandeza
# que um fornecedor por GB cobra. O `medir.py` soma esta coluna, e por isso o
# healthcheck, que vem da loopback, fica fora do log.
logformat bytes %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %un
access_log stdio:/var/log/squid/access.log bytes !localhost
cache_log stdio:/dev/null

httpd_suppress_version_string on
forwarded_for delete
pid_filename none
