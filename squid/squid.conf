# Proxy autenticado local, no lugar de um proxy residencial pago.
#
# Existe para reproduzir de graça a única coisa que importa para este demo: um
# proxy que EXIGE usuário e senha. É a autenticação que quebra o `--proxy-server`
# do Chrome, não o fato de o IP ser residencial.
#
# O que não é reproduzido, e não precisa ser: rotação de IP, geolocalização e a
# cobrança por gigabyte. O `access.log` registra os bytes de cada conexão, que é
# exatamente a grandeza que o fornecedor cobraria.

# Sem isto o Squid dimensiona estruturas internas pelo RLIMIT_NOFILE do
# container, que no Docker é enorme, e aborta na largada tentando alocar 2^30
# entradas de 432 bytes. O erro sai como "xcalloc: Unable to allocate" e não
# menciona descritor de arquivo em lugar nenhum. É o bug LP#1978272, e a imagem
# oficial carrega esta linha num include que some quando se troca o squid.conf.
max_filedescriptors 1024

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm proxy do demo
auth_param basic children 5
# NÃO colocar `credentialsttl 0 seconds` aqui. Parece a escolha certa para
# garantir que o desafio 407 aconteça sempre, e derruba o Squid com segmentation
# fault no primeiro CONNECT autenticado. O 407 acontece na primeira requisição
# de qualquer forma, que é o que o demo precisa mostrar.

acl autenticado proxy_auth REQUIRED
http_access allow autenticado
http_access deny all

http_port 3128

# CONNECT para 443 é obrigatório: o alvo é HTTPS, e sem isto o Squid recusaria o
# túnel e o erro apareceria como falha de rede, escondendo o de autenticação.
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Sem cache. Proxy residencial não cacheia, e cache aqui falsearia a medição: a
# segunda execução mediria zero byte e o número do post viraria mentira.
cache deny all

# `%<st` são os bytes que o Squid recebeu do servidor de origem, ou seja o que
# seria faturado. O `medir.py` soma esta coluna.
logformat bytes %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %un
access_log stdio:/var/log/squid/access.log bytes
cache_log stdio:/dev/null

httpd_suppress_version_string on
forwarded_for delete
pid_filename none
